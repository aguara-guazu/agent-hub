name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Windows paths, secrets, diagnostics and startup regressions
        run: npx vitest run packages/gateway/src/secrets.test.ts packages/gateway/src/platform.test.ts packages/daemon/src/secrets/index.test.ts packages/daemon/src/adapters/memory-hooks.test.ts packages/memory/test/vault.test.ts packages/memory/test/report.test.ts desktop/src/session.test.ts desktop/src/clients.test.ts desktop/src/prepare-sharp.test.ts
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install and open twice with a fresh profile
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'Agent Hub installed Pérez'
          $installer = (Resolve-Path 'release/AgentHub-Setup-x64.exe').Path
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/smoke-desktop.mjs (Join-Path $installDir 'Agent Hub.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.18.0, 24]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agenthub_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTHUB_MEMORY_TEST_URL: postgres://agenthub:test-only@localhost:5432/agenthub_memory_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
