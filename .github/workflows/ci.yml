name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agenthub_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Memory integration tests with PostgreSQL
        run: npx vitest run packages/memory/test packages/core/test/memory.test.ts --no-file-parallelism
        env:
          AGENTHUB_MEMORY_TEST_URL: postgres://agenthub:test-only@localhost:5432/agenthub_memory_test
