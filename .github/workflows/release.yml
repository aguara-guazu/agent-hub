name: Release

# Cada plataforma se construye en su propio runner (un instalador de Windows no se
# arma en macOS sin Wine) y los artefactos se adjuntan a la release del tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Compila shared, core, daemon, gateway, desktop y la consola.
      - run: npm run build
      - run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve versioned release notes
        shell: bash
        run: |
          notes="docs/release-${GITHUB_REF_NAME#v}.md"
          test -s "$notes"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Update manifest with sha256 and size of every published artifact. It is signed only when the signing
      # secret exists; the private key lives solely in the repository secrets and never reaches a file or a log.
      - name: Update manifest
        shell: bash
        env:
          AGENTHUB_UPDATE_SIGNING_KEY: ${{ secrets.AGENTHUB_UPDATE_SIGNING_KEY }}
          AGENTHUB_UPDATE_SIGNING_KEY_ID: ${{ vars.AGENTHUB_UPDATE_SIGNING_KEY_ID }}
          AGENTHUB_UPDATE_NEXT_TRUST: ${{ vars.AGENTHUB_UPDATE_NEXT_TRUST }}
        run: |
          mkdir -p artifacts/update-manifest
          node scripts/update-manifest.mjs artifacts "$GITHUB_REF_NAME" artifacts/update-manifest
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Agent Hub ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
